# Copy this file to your GZWItems-List repo at:
# .github/workflows/auto-merge.yml
#
# When you add the "approved" label to an issue, this action:
# 1. Extracts the JSON code block from the issue body
# 2. Merges it into the right file:
#      - issues labelled "new-item"  -> new-items.json      (append a record)
#      - everything else             -> price-overrides.json (merge fields)
# 3. Commits and pushes the change
# 4. Closes the issue with a comment

name: Auto-merge approved contributions

on:
  issues:
    types: [labeled]

jobs:
  merge-contribution:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-contribution
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract and merge JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Extract JSON from the code block
            const match = body.match(/```json\n([\s\S]*?)\n```/);
            if (!match) {
              core.setFailed('No JSON code block found in issue body.');
              return;
            }

            let submitted;
            try {
              submitted = JSON.parse(match[1]);
            } catch (e) {
              core.setFailed(`Invalid JSON in issue: ${e.message}`);
              return;
            }

            const isNewItem = (issue.labels || []).some((l) => l.name === 'new-item');

            if (isNewItem) {
              // ── New item: append to new-items.json ──
              const filePath = 'new-items.json';
              let items = [];
              if (fs.existsSync(filePath)) {
                items = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                if (!Array.isArray(items)) {
                  core.setFailed('new-items.json must contain a JSON array.');
                  return;
                }
              }

              const incoming = Array.isArray(submitted) ? submitted : [submitted];
              for (const entry of incoming) {
                if (!entry.name || !entry.type) {
                  core.setFailed('Each new item needs at least "name" and "type".');
                  return;
                }
                const index = items.findIndex((i) => i.id === entry.id);
                // Re-submitting the same id updates it instead of duplicating.
                if (index >= 0) {
                  items[index] = { ...items[index], ...entry };
                } else {
                  items.push(entry);
                }
              }

              items.sort((a, b) => String(a.id).localeCompare(String(b.id)));
              fs.writeFileSync(filePath, JSON.stringify(items, null, 2) + '\n');
              core.exportVariable('TARGET_FILE', filePath);
              core.exportVariable('ITEM_NAME', issue.title.replace(/^\[New item\]\s*/, '').trim());
            } else {
              // ── Correction: merge fields into price-overrides.json ──
              const filePath = 'price-overrides.json';
              let overrides = {};
              if (fs.existsSync(filePath)) {
                overrides = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              }

              for (const [itemId, fields] of Object.entries(submitted)) {
                if (!overrides[itemId]) {
                  overrides[itemId] = {};
                }
                Object.assign(overrides[itemId], fields);
              }

              // Write back sorted by key
              const sorted = Object.keys(overrides).sort().reduce((acc, key) => {
                acc[key] = overrides[key];
                return acc;
              }, {});

              fs.writeFileSync(filePath, JSON.stringify(sorted, null, 2) + '\n');
              core.exportVariable('TARGET_FILE', filePath);
              core.exportVariable('ITEM_NAME', issue.title.replace(/^\[Contribution\]\s*/, '').split('—')[0].trim());
            }

            core.exportVariable('ISSUE_NUMBER', issue.number);

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_FILE"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update $ITEM_NAME from contribution #$ISSUE_NUMBER"

          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto latest remote and retrying ($i)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
          done
          echo "Push failed after retries."
          exit 1

      - name: Close issue with comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const file = process.env.TARGET_FILE || 'price-overrides.json';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Merged into \`${file}\` and committed. Thanks for contributing! 🎉`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });
