# Copy this file to your GZWItems-List repo at:
# .github/workflows/auto-merge.yml
#
# When you add the "approved" label to an issue, this action:
# 1. Extracts the JSON code block from the issue body
# 2. Merges it into the right file:
#      - issues labelled "new-item"  -> new-items.json      (append a record)
#      - everything else             -> price-overrides.json (merge fields)
# 3. Commits and pushes the change
# 4. Closes the issue with a comment

name: Auto-merge approved contributions

on:
  issues:
    types: [labeled]

jobs:
  merge-contribution:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Merge and push (with retry + duplicate detection)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const sh = (cmd) => execSync(cmd, { stdio: 'pipe' }).toString();

            sh('git config user.name "github-actions[bot]"');
            sh('git config user.email "github-actions[bot]@users.noreply.github.com"');

            const issue = context.payload.issue;
            const body = issue.body || '';
            const ref = process.env.GITHUB_REF_NAME;

            const match = body.match(/```json\n([\s\S]*?)\n```/);
            if (!match) {
              core.setFailed('No JSON code block found in issue body.');
              return;
            }

            let submitted;
            try {
              submitted = JSON.parse(match[1]);
            } catch (e) {
              core.setFailed(`Invalid JSON in issue: ${e.message}`);
              return;
            }

            const isNewItem = (issue.labels || []).some((l) => l.name === 'new-item');
            const filePath = isNewItem ? 'new-items.json' : 'price-overrides.json';
            const itemName = isNewItem
              ? issue.title.replace(/^\[New item\]\s*/, '').trim()
              : issue.title.replace(/^\[Contribution\]\s*/, '').split('—')[0].trim();

            // Re-applies the contribution against whatever is currently on disk.
            // Returns false (no-op) if the contribution is already fully present —
            // this is what lets a re-run/duplicate label skip cleanly instead of failing.
            function applyMerge() {
              if (isNewItem) {
                let items = [];
                if (fs.existsSync(filePath)) {
                  items = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                  if (!Array.isArray(items)) {
                    core.setFailed('new-items.json must contain a JSON array.');
                    return null;
                  }
                }
                const incoming = Array.isArray(submitted) ? submitted : [submitted];
                let changed = false;
                for (const entry of incoming) {
                  if (!entry.name || !entry.type) {
                    core.setFailed('Each new item needs at least "name" and "type".');
                    return null;
                  }
                  const index = items.findIndex((i) => i.id === entry.id);
                  if (index >= 0) {
                    const merged = { ...items[index], ...entry };
                    if (JSON.stringify(merged) !== JSON.stringify(items[index])) {
                      items[index] = merged;
                      changed = true;
                    }
                  } else {
                    items.push(entry);
                    changed = true;
                  }
                }
                if (changed) {
                  items.sort((a, b) => String(a.id).localeCompare(String(b.id)));
                  fs.writeFileSync(filePath, JSON.stringify(items, null, 2) + '\n');
                }
                return changed;
              } else {
                let overrides = {};
                if (fs.existsSync(filePath)) {
                  overrides = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                }
                let changed = false;
                for (const [itemId, fields] of Object.entries(submitted)) {
                  if (!overrides[itemId]) overrides[itemId] = {};
                  for (const [k, v] of Object.entries(fields)) {
                    if (overrides[itemId][k] !== v) {
                      overrides[itemId][k] = v;
                      changed = true;
                    }
                  }
                }
                if (changed) {
                  const sorted = Object.keys(overrides).sort().reduce((acc, key) => {
                    acc[key] = overrides[key];
                    return acc;
                  }, {});
                  fs.writeFileSync(filePath, JSON.stringify(sorted, null, 2) + '\n');
                }
                return changed;
              }
            }

            let pushed = false;
            let skipped = false;

            for (let attempt = 1; attempt <= 8; attempt++) {
              sh(`git fetch origin ${ref}`);
              sh(`git reset --hard origin/${ref}`);

              const changed = applyMerge();
              if (changed === null) return; // setFailed already called
              if (!changed) {
                core.info('Contribution already reflected in the file — skipping, nothing to push.');
                skipped = true;
                break;
              }

              sh(`git add ${filePath}`);
              sh(`git commit -m "Update ${itemName} from contribution #${issue.number}"`);

              try {
                sh('git push origin HEAD:' + ref);
                pushed = true;
                break;
              } catch (e) {
                core.info(`Push rejected on attempt ${attempt}, re-fetching and retrying...`);
              }
            }

            if (!pushed && !skipped) {
              core.setFailed('Failed to push after retries.');
              return;
            }

            core.exportVariable('TARGET_FILE', filePath);
            core.exportVariable('ITEM_NAME', itemName);
            core.exportVariable('ISSUE_NUMBER', String(issue.number));
            core.exportVariable('WAS_SKIPPED', skipped ? 'true' : 'false');

      - name: Close issue with comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const file = process.env.TARGET_FILE || 'price-overrides.json';
            const wasSkipped = process.env.WAS_SKIPPED === 'true';
            const body = wasSkipped
              ? `This contribution is already reflected in \`${file}\` — nothing new to merge. Closing.`
              : `Merged into \`${file}\` and committed. Thanks for contributing! 🎉`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });
